name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare Keystore and Secrets
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore fallback..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          touch .env.example

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Djava.awt.headless=true"
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace -Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.daemon.jvm.options="-Djava.awt.headless=true"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LitoralNovelas-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

